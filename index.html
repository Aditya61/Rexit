<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rexit</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#05070D" />
<link rel="icon" href="./icons/icon-192.png" />
<style>
  :root {
    --bg: #05070D;
    --bg2: #0A1220;
    --panel: rgba(10, 22, 40, 0.82);
    --cyan: #38D9F9;
    --cyan-dim: rgba(56, 217, 249, 0.35);
    --cyan-glow: rgba(56, 217, 249, 0.22);
    --gold: #E8B23D;
    --gold-glow: rgba(232, 178, 61, 0.28);
    --danger: #FF5C6C;
    --danger-glow: rgba(255, 92, 108, 0.25);
    --text: #DCEEFC;
    --muted: #6E859C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Courier New", monospace;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0);
    background:
      radial-gradient(ellipse at top, #0d1830 0%, #05070D 60%),
      repeating-linear-gradient(0deg, rgba(56,217,249,0.02) 0px, rgba(56,217,249,0.02) 1px, transparent 1px, transparent 3px);
  }
  #app-root { max-width: 480px; margin: 0 auto; padding: 20px 14px 60px; }

  .masthead { margin-bottom: 20px; text-align: center; }
  .masthead .frame-tag { font-size: 11px; letter-spacing: 0.25em; color: var(--cyan); text-shadow: 0 0 8px var(--cyan-glow); }
  .masthead h1 {
    font-weight: 700; font-size: 24px; letter-spacing: 0.08em; margin: 6px 0 4px;
    color: var(--text); text-shadow: 0 0 12px var(--cyan-glow);
  }
  .masthead p { margin: 0; color: var(--muted); font-size: 12px; max-width: 36ch; margin: 0 auto; }

  .track {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    box-shadow: 0 0 18px var(--cyan-glow), inset 0 0 24px rgba(56,217,249,0.04);
    padding: 20px 16px 18px;
    margin-bottom: 22px;
    backdrop-filter: blur(2px);
  }
  .track::before, .track::after,
  .track .corner-br, .track .corner-bl {
    content: ""; position: absolute; width: 14px; height: 14px;
    border-color: var(--cyan); border-style: solid; border-width: 0;
  }
  .track::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .track::after { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
  .track .corner-bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  .track .corner-br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

  .track.exit { border-color: rgba(232,178,61,0.4); box-shadow: 0 0 18px var(--gold-glow), inset 0 0 24px rgba(232,178,61,0.04); }
  .track.exit::before, .track.exit::after, .track.exit .corner-bl, .track.exit .corner-br { border-color: var(--gold); }

  .track h2 {
    font-size: 14px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    margin: 0 0 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow);
  }
  .track.exit h2 { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
  .track h2::before { content: '\25c6 ' ; }
  .track .sub { font-size: 11px; color: var(--muted); margin: 0 0 16px; letter-spacing: 0.03em; }

  .streak { font-size: 11px; font-weight: 700; white-space: nowrap; letter-spacing: 0.05em; }

  .dots { display: flex; gap: 6px; margin-bottom: 16px; }
  .dot {
    width: 24px; height: 24px; border: 1px solid var(--cyan-dim); background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted);
  }
  .dot.hit { background: var(--cyan); border-color: var(--cyan); color: #04121a; box-shadow: 0 0 10px var(--cyan-glow); font-weight: 700; }

  .checklist { list-style: none; margin: 0 0 14px; padding: 0; }
  .checklist li {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
    border-bottom: 1px dashed rgba(110,133,156,0.25); font-size: 13px;
  }
  .checklist li:last-child { border-bottom: none; }
  .checklist li::before { content: "\25B8"; color: var(--cyan); flex-shrink: 0; margin-top: 1px; }
  .track.exit .checklist li::before { color: var(--gold); }
  .checklist input[type="checkbox"] {
    appearance: none; width: 18px; height: 18px; margin-top: 0; flex-shrink: 0;
    border: 1px solid var(--cyan-dim); background: rgba(0,0,0,0.3); cursor: pointer; position: relative;
  }
  .checklist input[type="checkbox"]:checked { background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
  .checklist input[type="checkbox"]:checked::after { content: "\u2713"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #04121a; }
  .track.exit .checklist input[type="checkbox"]:checked { background: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
  .checklist label { flex: 1; cursor: pointer; letter-spacing: 0.01em; }
  .checklist .done label { color: var(--muted); text-decoration: line-through; }

  button {
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid var(--cyan); background: rgba(56,217,249,0.1); color: var(--cyan);
    padding: 11px 14px; cursor: pointer; box-shadow: 0 0 10px var(--cyan-glow);
  }
  .btn-exit { border-color: var(--gold); background: rgba(232,178,61,0.12); color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
  .btn-ghost { background: transparent; border-color: var(--muted); color: var(--muted); box-shadow: none; }
  .btn-block { display: block; width: 100%; text-align: center; }

  .save-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .save-note { font-size: 11px; color: var(--cyan); letter-spacing: 0.05em; }

  .offer-form { display: flex; gap: 8px; margin-top: 4px; margin-bottom: 12px; }
  .offer-form input {
    flex: 1; font-family: inherit; font-size: 13px; padding: 9px 10px;
    border: 1px solid var(--cyan-dim); background: rgba(0,0,0,0.3); color: var(--text); min-width: 0;
  }
  .offer-form input.ctc { flex: 0 0 76px; }

  .offer-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(232,178,61,0.25); padding: 10px 12px; margin-bottom: 8px;
  }
  .offer-row .who { font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
  .offer-row .ctc { font-size: 11px; color: var(--muted); }
  .verdict { font-size: 10px; font-weight: 700; padding: 4px 8px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid; }
  .verdict.decline { color: var(--danger); border-color: var(--danger); text-shadow: 0 0 6px var(--danger-glow); }
  .verdict.floor { color: #6FE39A; border-color: #6FE39A; text-shadow: 0 0 6px rgba(111,227,154,0.3); }
  .verdict.strong { color: var(--cyan); border-color: var(--cyan); text-shadow: 0 0 6px var(--cyan-glow); }
  .verdict.stretch { color: var(--gold); border-color: var(--gold); text-shadow: 0 0 6px var(--gold-glow); }
  .remove-btn { background: none; border: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 4px; cursor: pointer; }

  .empty { font-size: 12px; color: var(--muted); padding: 8px 0; }
  .floor-note {
    font-size: 11px; color: var(--muted); background: rgba(0,0,0,0.25);
    border: 1px dashed var(--cyan-dim); padding: 9px 10px; margin-top: 10px; letter-spacing: 0.02em;
  }

  .report-summary { font-size: 13px; margin: 0 0 10px; color: var(--text); }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .metric { background: rgba(0,0,0,0.25); border: 1px solid var(--cyan-dim); padding: 8px 10px; }
  .metric .v { font-size: 15px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 6px var(--cyan-glow); }
  .metric .k { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .rec-list { margin: 0 0 12px; padding-left: 16px; font-size: 12.5px; color: var(--text); }
  .rec-list li { margin-bottom: 4px; }
  .past-reports { font-size: 11px; color: var(--muted); }
  .past-reports div { padding: 5px 0; border-top: 1px dashed rgba(110,133,156,0.2); }

  .io-row { display: flex; gap: 8px; }
  .io-row button, .io-row label { flex: 1; }
  input[type="file"] { display: none; }

  .reset-row { text-align: center; margin-top: 8px; }
  .reset-row button { background: none; border: none; color: var(--muted); font-size: 10px; letter-spacing: 0.1em; text-decoration: underline; cursor: pointer; box-shadow: none; }

  .install-hint {
    font-size: 11px; color: var(--muted); background: rgba(0,0,0,0.25);
    border: 1px solid var(--cyan-dim); padding: 10px 12px; margin-bottom: 18px; letter-spacing: 0.02em;
  }
  .install-hint strong { color: var(--cyan); }
</style>
</head>
<body>
<div id="app-root"></div>

<script>
(function () {
  const DEFAULT_RECOVERY_ITEMS = [
    { id: "wake", label: "Held the anchor wake-time" },
    { id: "trigger", label: "Alarm was out of arm's reach / used a trigger" },
    { id: "light", label: "Got real light while upright (not lying in bed)" },
    { id: "bedtime", label: "Protected tonight's bedtime" },
    { id: "nap", label: "No long or late nap today" }
  ];

  const DEFAULT_EXIT_ITEMS = [
    { id: "resume", label: "Resume finalized" },
    { id: "linkedin", label: "LinkedIn headline + About updated" },
    { id: "tabit", label: "Tabit pushed to GitHub with README" },
    { id: "targets", label: "Target company list built" },
    { id: "applying", label: "Applications underway" },
    { id: "clawback", label: "Clawback figure confirmed in writing by HR" },
    { id: "interview", label: "First interview scheduled" },
    { id: "guildborne", label: "Guildborne: Quest Board live" }
  ];

  // --- local storage helpers (all data stays on this device) ---
  function lsGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { console.error("save failed", e); }
  }

  function todayKey(d) { return d.toISOString().slice(0, 10); }

  function verdictFor(ctc) {
    const n = parseFloat(ctc);
    if (isNaN(n)) return null;
    if (n < 7) return { cls: "decline", label: "Decline" };
    if (n < 9) return { cls: "floor", label: "Floor \u2014 Accept" };
    if (n < 12) return { cls: "strong", label: "Strong \u2014 Accept" };
    return { cls: "stretch", label: "Stretch \u2014 Accept" };
  }

  let config = lsGet("trackerConfig", { recoveryItems: DEFAULT_RECOVERY_ITEMS, exitItems: DEFAULT_EXIT_ITEMS });
  let recoveryLog = lsGet("recoveryLog", {});
  let exitState = lsGet("exitMilestones", {});
  let offers = lsGet("offerLog", []);
  let reportHistory = lsGet("reportHistory", []);

  function computeStreak() {
    let streak = 0;
    let d = new Date();
    if (!(recoveryLog[todayKey(d)] && recoveryLog[todayKey(d)].wake)) {
      d.setDate(d.getDate() - 1);
    }
    while (true) {
      const k = todayKey(d);
      if (recoveryLog[k] && recoveryLog[k].wake) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else break;
    }
    return streak;
  }

  function last7() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = todayKey(d);
      days.push({ label: d.toLocaleDateString(undefined, { weekday: "narrow" }), hit: !!(recoveryLog[k] && recoveryLog[k].wake) });
    }
    return days;
  }

  function downloadJSON(obj, filename) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function applyChecklistChanges(section, changes) {
    if (!changes) return;
    let items = section === "recovery" ? config.recoveryItems.slice() : config.exitItems.slice();
    if (Array.isArray(changes.remove)) {
      items = items.filter(it => !changes.remove.includes(it.id));
    }
    if (Array.isArray(changes.relabel)) {
      changes.relabel.forEach(r => {
        const found = items.find(it => it.id === r.id);
        if (found) found.label = r.label;
      });
    }
    if (Array.isArray(changes.add)) {
      changes.add.forEach(a => {
        if (!items.find(it => it.id === a.id)) items.push({ id: a.id, label: a.label });
      });
    }
    if (section === "recovery") config.recoveryItems = items;
    else config.exitItems = items;
  }

  function handleImportedReport(report) {
    if (!report || report.type !== "analysis-report") {
      alert("This doesn't look like a tracker analysis report file.");
      return;
    }
    if (report.checklistChanges) {
      applyChecklistChanges("recovery", report.checklistChanges.recovery);
      applyChecklistChanges("exit", report.checklistChanges.exit);
      lsSet("trackerConfig", config);
    }
    reportHistory.unshift({
      reportDate: report.reportDate || todayKey(new Date()),
      summary: report.summary || "",
      metrics: report.metrics || {},
      recommendations: report.recommendations || []
    });
    reportHistory = reportHistory.slice(0, 10);
    lsSet("reportHistory", reportHistory);
    render();
  }

  const root = document.getElementById("app-root");

  function render() {
    const today = new Date();
    const tKey = todayKey(today);
    const todayLog = recoveryLog[tKey] || {};
    const streak = computeStreak();
    const dots = last7();
    const latestReport = reportHistory[0];
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

    root.innerHTML = `
      <div class="masthead">
        <div class="frame-tag">\u25C7 STATUS WINDOW \u25C7</div>
        <h1>PLAYER LOG</h1>
        <p>Vitality and the exit quest, tracked in parallel. Local data only.</p>
      </div>

      ${!isStandalone ? `
      <div class="install-hint">
        Running in browser mode. Chrome menu \u2192 <strong>"Add to Home screen"</strong> to install for real offline use.
      </div>` : ""}

      ${latestReport ? `
      <section class="track">
        <div class="corner-bl"></div><div class="corner-br"></div>
        <h2>System Log <span class="save-note">${latestReport.reportDate}</span></h2>
        <p class="report-summary">${latestReport.summary}</p>
        ${Object.keys(latestReport.metrics || {}).length ? `
          <div class="metric-grid">
            ${Object.entries(latestReport.metrics).map(([k, v]) => `
              <div class="metric"><div class="v">${v}</div><div class="k">${k}</div></div>
            `).join("")}
          </div>` : ""}
        ${latestReport.recommendations && latestReport.recommendations.length ? `
          <ul class="rec-list">
            ${latestReport.recommendations.map(r => `<li>${r}</li>`).join("")}
          </ul>` : ""}
        ${reportHistory.length > 1 ? `
          <div class="past-reports">
            ${reportHistory.slice(1).map(r => `<div>${r.reportDate} \u2014 ${r.summary}</div>`).join("")}
          </div>` : ""}
      </section>
      ` : ""}

      <section class="track">
        <div class="corner-bl"></div><div class="corner-br"></div>
        <h2>Vitality <span class="streak">STREAK: ${streak}D</span></h2>
        <p class="sub">${today.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }).toUpperCase()}</p>
        <div class="dots">${dots.map(d => `<div class="dot ${d.hit ? "hit" : ""}">${d.label}</div>`).join("")}</div>
        <ul class="checklist" id="recovery-list">
          ${config.recoveryItems.map(item => `
            <li class="${todayLog[item.id] ? "done" : ""}">
              <input type="checkbox" id="rec-${item.id}" data-id="${item.id}" ${todayLog[item.id] ? "checked" : ""} />
              <label for="rec-${item.id}">${item.label}</label>
            </li>
          `).join("")}
        </ul>
        <div class="save-row">
          <button id="save-recovery-btn">Save Progress</button>
          <span class="save-note" id="recovery-save-note"></span>
        </div>
      </section>

      <section class="track exit">
        <div class="corner-bl"></div><div class="corner-br"></div>
        <h2>Main Quest \u2014 Exit</h2>
        <p class="sub">MILESTONES TO CLEAR</p>
        <ul class="checklist" id="exit-list">
          ${config.exitItems.map(item => `
            <li class="${exitState[item.id] ? "done" : ""}">
              <input type="checkbox" id="exit-${item.id}" data-id="${item.id}" ${exitState[item.id] ? "checked" : ""} />
              <label for="exit-${item.id}">${item.label}</label>
            </li>
          `).join("")}
        </ul>

        <h2 style="font-size:12px;margin-top:16px;">Reward Offers</h2>
        <div class="offer-form">
          <input type="text" id="offer-company" placeholder="Company" />
          <input type="number" step="0.1" class="ctc" id="offer-ctc" placeholder="LPA" />
          <button class="btn-exit" id="add-offer-btn">Add</button>
        </div>
        <div class="offer-list" id="offer-list">
          ${offers.length === 0 ? '<p class="empty">No offers logged yet.</p>' :
            offers.map((o, i) => {
              const v = verdictFor(o.ctc);
              return `
                <div class="offer-row">
                  <div><div class="who">${o.company}</div><div class="ctc">\u20B9${o.ctc} LPA</div></div>
                  <span class="verdict ${v.cls}">${v.label}</span>
                  <button class="remove-btn" data-i="${i}" aria-label="Remove">\u00d7</button>
                </div>`;
            }).join("")
          }
        </div>
        <p class="floor-note">FLOOR: \u20B98\u20138.5L clears instantly, clawback included. \u20B99\u201310L is a strong clear. \u20B912L+ is the rare drop \u2014 take it if it appears, don't farm for it.</p>
      </section>

      <section class="track">
        <div class="corner-bl"></div><div class="corner-br"></div>
        <h2>System Sync</h2>
        <p class="sub">EXPORT TO ANALYZE \u00b7 IMPORT TO UPDATE QUEST LOG</p>
        <div class="io-row">
          <button id="export-btn">Export Data</button>
          <label class="btn-ghost btn-block" for="import-input" style="display:flex;align-items:center;justify-content:center;">Import Report</label>
          <input type="file" id="import-input" accept="application/json" />
        </div>
      </section>

      <div class="reset-row">
        <button id="reset-btn">\u26A0 Reset All Status Data</button>
      </div>
    `;

    document.getElementById("save-recovery-btn").addEventListener("click", () => {
      const entry = {};
      config.recoveryItems.forEach(item => { entry[item.id] = document.getElementById("rec-" + item.id).checked; });
      recoveryLog[tKey] = entry;
      lsSet("recoveryLog", recoveryLog);
      document.getElementById("recovery-save-note").textContent = "Saved";
      render();
    });

    config.recoveryItems.forEach(item => {
      const el = document.getElementById("rec-" + item.id);
      if (el) el.addEventListener("change", (e) => { e.target.closest("li").classList.toggle("done", e.target.checked); });
    });

    config.exitItems.forEach(item => {
      const el = document.getElementById("exit-" + item.id);
      if (el) el.addEventListener("change", (e) => {
        exitState[item.id] = e.target.checked;
        e.target.closest("li").classList.toggle("done", e.target.checked);
        lsSet("exitMilestones", exitState);
      });
    });

    document.getElementById("add-offer-btn").addEventListener("click", () => {
      const companyEl = document.getElementById("offer-company");
      const ctcEl = document.getElementById("offer-ctc");
      const company = companyEl.value.trim();
      const ctc = ctcEl.value.trim();
      if (!company || !ctc) return;
      offers.push({ company, ctc });
      lsSet("offerLog", offers);
      render();
    });

    document.querySelectorAll(".remove-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const i = parseInt(e.target.getAttribute("data-i"), 10);
        offers.splice(i, 1);
        lsSet("offerLog", offers);
        render();
      });
    });

    document.getElementById("export-btn").addEventListener("click", () => {
      const payload = {
        type: "tracker-export",
        exportedAt: new Date().toISOString(),
        recoveryLog, exitMilestones: exitState, offers, config
      };
      downloadJSON(payload, "tracker-export-" + todayKey(today) + ".json");
    });

    document.getElementById("import-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const report = JSON.parse(reader.result);
          handleImportedReport(report);
        } catch (err) {
          alert("Couldn't read that file \u2014 make sure it's the analysis report JSON.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      if (!confirm("Clear all saved tracker data on this device? This can't be undone.")) return;
      recoveryLog = {}; exitState = {}; offers = []; reportHistory = [];
      config = { recoveryItems: DEFAULT_RECOVERY_ITEMS, exitItems: DEFAULT_EXIT_ITEMS };
      lsSet("recoveryLog", recoveryLog);
      lsSet("exitMilestones", exitState);
      lsSet("offerLog", offers);
      lsSet("reportHistory", reportHistory);
      lsSet("trackerConfig", config);
      render();
    });
  }

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
